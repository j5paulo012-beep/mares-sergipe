<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marés de Sergipe</title>
  
  <!-- Configurações de Aplicativo (PWA Integrado) -->
  <meta name="theme-color" content="#0284c7">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Marés SE">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3135/3135715.png">
  
  <!-- Manifest Embutido Via Data URI para Permitir Instalação Direta -->
  <link rel="manifest" href='data:application/manifest+json,{"name":"Marés de Sergipe","short_name":"Marés SE","start_url":"./index.html","display":"standalone","background_color":"#0284c7","theme_color":"#0284c7","icons":[{"src":"https://cdn-icons-png.flaticon.com/512/3135/3135715.png","sizes":"512x512","type":"image/png"}]}'>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #f0f9ff; color: #0f172a; padding: 16px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
    header { text-align: center; margin-bottom: 20px; }
    h1 { color: #0284c7; font-size: 1.6rem; margin-bottom: 4px; }
    p.subtitle { color: #64748b; font-size: 0.9rem; }
    .card { background: #ffffff; width: 100%; max-width: 480px; border-radius: 16px; padding: 16px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); margin-bottom: 16px; }
    .controls { display: flex; gap: 8px; margin-bottom: 16px; }
    input[type="date"] { flex: 1; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 1rem; color: #334155; }
    .tide-list { display: flex; flex-direction: column; gap: 10px; }
    .tide-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; border-radius: 10px; background-color: #f8fafc; border-left: 5px solid #cbd5e1; }
    .tide-item.alta { border-left-color: #0284c7; background-color: #f0f9ff; }
    .tide-item.baixa { border-left-color: #f59e0b; background-color: #fffbeb; }
    .time { font-weight: bold; font-size: 1.1rem; }
    .height { font-weight: 600; font-size: 1rem; }
    .badge { padding: 4px 8px; border-radius: 6px; font-size: 0.75rem; font-weight: bold; text-transform: uppercase; }
    .badge-alta { background-color: #e0f2fe; color: #0369a1; }
    .badge-baixa { background-color: #fef3c7; color: #b45309; }
    .empty-state { text-align: center; color: #94a3b8; padding: 20px 0; }
  </style>
</head>
<body>

  <header>
    <h1>🌊 Marés de Sergipe</h1>
    <p class="subtitle">Barra dos Coqueiros - Setembro a Dezembro 2026</p>
  </header>

  <main class="card">
    <div class="controls">
      <input type="date" id="datePicker" min="2026-09-01" max="2026-12-31">
    </div>

    <div id="tideResults" class="tide-list">
      <!-- Resultados serão inseridos via JS -->
    </div>
  </main>

  <script>
    // Registro Automático do Service Worker para PWA sem precisar de arquivo extra
    if ('serviceWorker' in navigator) {
      const swCode = `
        self.addEventListener('install', e => self.skipWaiting());
        self.addEventListener('activate', e => self.clients.claim());
        self.addEventListener('fetch', e => e.respondWith(fetch(e.request)));
      `;
      const blob = new Blob([swCode], { type: 'application/javascript' });
      const swUrl = URL.createObjectURL(blob);
      navigator.serviceWorker.register(swUrl).catch(() => {});
    }

    // Dados de Marés da Barra dos Coqueiros (Exemplo do Período Set–Dez 2026)
    const tideData = {
      "2026-09-17": [
        { time: "03:12", height: 0.3, type: "baixa" },
        { time: "09:25", height: 2.1, type: "alta" },
        { time: "15:40", height: 0.4, type: "baixa" },
        { time: "21:50", height: 2.0, type: "alta" }
      ],
      "2026-09-18": [
        { time: "03:50", height: 0.2, type: "baixa" },
        { time: "10:02", height: 2.2, type: "alta" },
        { time: "16:18", height: 0.3, type: "baixa" },
        { time: "22:28", height: 2.1, type: "alta" }
      ]
    };

    const datePicker = document.getElementById('datePicker');
    const tideResults = document.getElementById('tideResults');

    // Define a data atual como padrão se estiver no intervalo
    const today = new Date().toISOString().split('T')[0];
    datePicker.value = (today >= "2026-09-01" && today <= "2026-12-31") ? today : "2026-09-17";

    function renderTides(selectedDate) {
      tideResults.innerHTML = '';
      const dayData = tideData[selectedDate];

      if (!dayData || dayData.length === 0) {
        tideResults.innerHTML = '<div class="empty-state">Nenhum dado disponível para esta data.</div>';
        return;
      }

      dayData.forEach(item => {
        const div = document.createElement('div');
        div.className = `tide-item ${item.type}`;
        div.innerHTML = `
          <div>
            <span class="time">${item.time}</span>
            <span class="badge badge-${item.type}">${item.type === 'alta' ? 'Maré Cheia' : 'Maré Baixa'}</span>
          </div>
          <div class="height">${item.height.toFixed(1)} m</div>
        `;
        tideResults.appendChild(div);
      });
    }

    datePicker.addEventListener('change', (e) => renderTides(e.target.value));
    renderTides(datePicker.value);
  </script>
</body>
</html>
